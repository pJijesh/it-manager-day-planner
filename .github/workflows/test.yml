name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Smoke test the quick start
        run: |
          day-planner init my-planner
          day-planner plan --profile examples/profile.json --tasks examples/tasks.csv --date 2026-10-26 --out plan.md
          day-planner week --profile examples/profile.json --tasks examples/tasks.csv --start 2026-10-26 --out week.md
          day-planner review --profile examples/profile.json --tasks examples/tasks-friday-snapshot.csv --week-start 2026-10-26 --out review.md
          day-planner rhythm --cadence weekly
